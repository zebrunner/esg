
name: backend
services:
  task-definitions:
    container_name: task-definitions
    image: public.ecr.aws/zebrunner/task-definitions:3.0
    env_file:
      - ./properties/config.env
      - ./properties/task-definitions.env
      - ./properties/data.env
    networks:
      - service-network
    restart: always
#    volumes:
#      - "${HOME}/.aws:/root/.aws"
  scaler:
    container_name: scaler
    image: public.ecr.aws/zebrunner/scaler:3.0
    env_file:
      - ./properties/config.env
      - ./properties/scaler.env
      - ./properties/data.env
    networks:
      - service-network
    restart: always
#    volumes:
#      - "${HOME}/.aws:/root/.aws"
  router_1:
    container_name: router_1
    image: public.ecr.aws/zebrunner/router:3.0
    environment:
      - EXTERNAL_PORT=$ROUTER_PORT_1
    env_file:
      - ./properties/config.env
      - ./properties/router.env
      - ./properties/data.env
    ports:
      - "$ROUTER_PORT_1:4444"
    logging:
     options:
      max-size: "512m"
    volumes:
      - "./properties/prometheus-targets.yml:/etc/prometheus/prometheus-targets.yml"
    networks:
      - service-network
    restart: always
    #    volumes:
    #      - "${HOME}/.aws:/root/.aws"
  router_2:
    container_name: router_2
    image: public.ecr.aws/zebrunner/router:3.0
    environment:
      - EXTERNAL_PORT=$ROUTER_PORT_2
    env_file:
      - ./properties/config.env
      - ./properties/router.env
      - ./properties/data.env
    ports:
        - "$ROUTER_PORT_2:4444"
    logging:
     options:
      max-size: "512m"
    volumes:
      - "./properties/prometheus-targets.yml:/etc/prometheus/prometheus-targets.yml"
    networks:
      - service-network
    restart: always
    #    volumes:
    #      - "${HOME}/.aws:/root/.aws"
  prometheus:
    container_name: prometheus
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    networks:
      - service-network
    volumes:
      - "./properties/prometheus.yml:/etc/prometheus/prometheus.yml"
      - "./properties/prometheus-targets.yml:/etc/prometheus/prometheus-targets.yml"
      - "prometheus-data:/prometheus prom/prometheus"
