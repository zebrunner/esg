version: "3.8"
services:
  router:
    build:
      context: .
      dockerfile: ./build/Dockerfile.server
    image: public.ecr.aws/zebrunner/router:2.1.4-beta1
    ports:
        - "4444-4445:4444"
    links:
      - redis
      - db
    command: ./scripts/entrypoint.sh
    logging:
     options:
      max-size: "512m"
    restart: always
    environment:
      - API_ACCESS_KEY=secure_password
  scaler:
    container_name: scaler
    build:
      context: .
      dockerfile: build/Dockerfile.management
    image: public.ecr.aws/zebrunner/scaler:2.1.4-beta1
    links:
      - redis
    command:
      - ./scripts/management_entrypoint.sh
    restart: always
  db:
    image: postgres:13
    container_name: postgres
    volumes:
      - "pgdata-volume:/var/lib/postgresql/data"
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    restart: always
  redis:
    image: redis:6
    container_name: redis
    ports:
      - "6379:6379"
    restart: always
volumes:
  pgdata-volume:
