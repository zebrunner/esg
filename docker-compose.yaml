version: "3.3"
services: 
  grid:
    container_name: esg-grid
    build: .
    ports: 
        - "4444:4444"
        - "4445:4445"
    volumes:
      - "${HOME}/.aws:/root/.aws"
    links:
      - redis
      - db
    command: ./entrypoint.sh
  db:
    image: postgres:13
    container_name: esg-postgres
    volumes:
      - "pgdata-volume:/var/lib/postgresql/data"
    environment: 
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    restart: always
  redis:
    image: redis:6
    container_name: esg-redis
    ports:
      - "6379:6379"
volumes:
  pgdata-volume:
