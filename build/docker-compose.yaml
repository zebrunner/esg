
services:
  router:
    build:
      context: ../
      dockerfile: build/Dockerfile.router
    image: public.ecr.aws/zebrunner/router:$ROUTER_VERSION
  scaler:
    build:
      context: ../
      dockerfile: build/Dockerfile.scaler
    image: public.ecr.aws/zebrunner/scaler:$SCALER_VERSION
  e3s-migration:
    build:
      context: ../
      dockerfile: build/Dockerfile.e3s-migration
    image: public.ecr.aws/zebrunner/e3s-migration:latest
  e3s-definitions:
    build:
      context: ../
      dockerfile: build/Dockerfile.e3s-definitions
    image: public.ecr.aws/zebrunner/e3s-definitions:$ROUTER_VERSION
