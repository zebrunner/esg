
services:
  router:
    build:
      context: ../
      dockerfile: build/Dockerfile.router
    image: public.ecr.aws/zebrunner/router:$ROUTER_VERSION
  scaler:
    build:
      context: ../
      dockerfile: build/Dockerfile.scaler
    image: public.ecr.aws/zebrunner/scaler:$SCALER_VERSION
  migration:
    build:
      context: ../
      dockerfile: build/Dockerfile.migration
    image: public.ecr.aws/zebrunner/migration:latest
  task-definitions:
    build:
      context: ../
      dockerfile: build/Dockerfile.task-definitions
    image: public.ecr.aws/zebrunner/task-definitions:$ROUTER_VERSION
